spring:
  application:
    name: gestdoc
  datasource:
    # Valeurs par défaut pour un lancement depuis l'IDE (MySQL du conteneur sur le port 3307).
    # Dans Docker, elles sont remplacées par les variables d'environnement du compose.
    url: jdbc:mysql://localhost:3307/docs_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: docs_user
    password: docs_pass
  jpa:
    hibernate:
      ddl-auto: update   # Hibernate crée/adapte les tables (suffisant pour un projet de 15 jours)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
